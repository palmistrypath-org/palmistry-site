<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1014 278" width="1014" height="278" role="img" aria-labelledby="t">
<title id="t">Four close-up examples compare a deep clear line, a thin faint line, a broad shallow line, and a chained line.</title>
<defs>
  <radialGradient id="haze" cx="50%" cy="48%" r="60%">
    <stop offset="0%" stop-color="#3a2470" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#1a1030" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#07050d" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#17122a"/>
    <stop offset="100%" stop-color="#0d0a1a"/>
  </linearGradient>
  <radialGradient id="mountGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#e0c07e" stop-opacity="0.55"/>
    <stop offset="60%" stop-color="#c9a96e" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8a5cf0" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#8a5cf0" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#c9a96e" stroke-width="0.5" opacity="0.28"/>
  </pattern>
  <pattern id="hatch2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-52)">
    <line x1="0" y1="0" x2="0" y2="9" stroke="#c9a96e" stroke-width="0.4" opacity="0.16"/>
  </pattern>
  <pattern id="grille" width="8" height="8" patternUnits="userSpaceOnUse">
    <path d="M 0 4 H 8 M 4 0 V 8" stroke="#e0c07e" stroke-width="0.9" opacity="0.8"/>
  </pattern>
  <clipPath id="hand"><path d="M 335 1010 C 300 900 290 800 300 690 C 255 655 190 585 162 505 C 146 466 178 432 218 448 C 262 478 315 525 345 562 C 356 545 360 500 365 440 C 360 350 360 250 370 175 C 375 140 445 140 452 175 C 458 260 458 350 462 430 C 466 430 466 430 466 430 C 468 330 470 210 478 125 C 484 90 555 90 560 125 C 566 210 566 330 566 430 C 570 430 570 430 570 430 C 572 340 574 240 580 165 C 585 130 655 130 660 165 C 665 240 665 340 664 435 C 668 445 668 445 668 445 C 672 380 676 320 682 270 C 686 240 742 240 748 275 C 754 340 752 400 740 470 C 720 600 700 750 640 880 C 620 940 610 980 605 1010 C 520 1032 420 1032 335 1010 Z"/></clipPath>
