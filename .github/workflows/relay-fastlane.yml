name: Relay Fast Lane

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: palmistry-path-relay-fastlane
  cancel-in-progress: false

jobs:
  advance:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate preauthorized Relay PR
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GH_REPOSITORY}"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          ENABLED="$(jq -r '.enabled' .ai-ops/fastlane.json)"
          [[ "$ENABLED" == "true" ]] || { echo "Fast lane disabled"; exit 0; }

          PRS="$(curl --fail-with-body -sS "${AUTH[@]}" "${API}/commits/${HEAD_SHA}/pulls")"
          PR="$(jq -c '[.[] | select(.state=="open" and .base.ref=="main" and (.title | startswith("[RELAY ")))] | first // empty' <<<"$PRS")"
          [[ -n "$PR" ]] || { echo "No open Relay PR for successful CI head ${HEAD_SHA}"; exit 0; }

          PR_NUMBER="$(jq -r '.number' <<<"$PR")"
          PR_TITLE="$(jq -r '.title' <<<"$PR")"
          PR_BODY="$(jq -r '.body // ""' <<<"$PR")"
          LIVE_HEAD="$(jq -r '.head.sha' <<<"$PR")"
          DRAFT="$(jq -r '.draft' <<<"$PR")"
          [[ "$LIVE_HEAD" == "$HEAD_SHA" ]] || { echo "PR head moved"; exit 0; }
          [[ "$DRAFT" == "false" ]] || { echo "PR remains draft"; exit 0; }

          STATE_TASK="$(jq -r '.current_task_id // empty' .ai-ops/state.json)"
          STATE_REV="$(jq -r '.current_task_revision // 0' .ai-ops/state.json)"
          STATE_STATUS="$(jq -r '.status' .ai-ops/state.json)"
          HUMAN_GATE="$(jq -r '.human_gate // empty' .ai-ops/state.json)"
          PAUSE_REASON="$(jq -r '.pause_reason // empty' .ai-ops/state.json)"
          RELAY_ENABLED="$(jq -r '.relay_enabled' .ai-ops/state.json)"
          CREDIT_GUARD="$(jq -r '.credit_guard' .ai-ops/state.json)"

          [[ "$RELAY_ENABLED" == "true" && "$CREDIT_GUARD" == "CONFIRMED_DISABLED" ]] || { echo "Relay safety gate closed"; exit 0; }
          [[ "$STATE_STATUS" == "READY_FOR_CLAUDE" ]] || { echo "State is not eligible for fast-lane review: $STATE_STATUS"; exit 0; }
          [[ -z "$HUMAN_GATE" && -z "$PAUSE_REASON" ]] || { echo "Human/pause gate present"; exit 0; }

          ENTRY="$(jq -c --arg id "$STATE_TASK" --argjson rev "$STATE_REV" '.tasks[] | select(.task_id==$id and .revision==$rev)' .ai-ops/fastlane.json)"
          [[ -n "$ENTRY" ]] || { echo "Current task is not preauthorized for fast lane: ${STATE_TASK} r${STATE_REV}"; exit 0; }

          grep -Fq "[RELAY ${STATE_TASK}]" <<<"$PR_TITLE" || { echo "PR title task mismatch"; exit 0; }
          grep -Fq "RELAY_TASK_ID: ${STATE_TASK}" <<<"$PR_BODY" || { echo "PR body task footer mismatch"; exit 0; }
          grep -Fq "RELAY_TASK_REVISION: ${STATE_REV}" <<<"$PR_BODY" || { echo "PR body revision footer mismatch"; exit 0; }
          grep -Fq "RELAY_RESULT: READY_FOR_REVIEW" <<<"$PR_BODY" || { echo "PR is not READY_FOR_REVIEW"; exit 0; }

          RESULT_PATH="$(jq -r '.expected_result_path' <<<"$ENTRY")"
          git fetch origin "$HEAD_SHA"
          RESULT="$(git show "${HEAD_SHA}:${RESULT_PATH}" 2>/dev/null || true)"
          [[ -n "$RESULT" ]] || { echo "Missing result artifact at ${RESULT_PATH}"; exit 0; }
          [[ "$(jq -r '.task_id' <<<"$RESULT")" == "$STATE_TASK" ]] || { echo "Result task mismatch"; exit 0; }
          [[ "$(jq -r '.revision' <<<"$RESULT")" == "$STATE_REV" ]] || { echo "Result revision mismatch"; exit 0; }
          [[ "$(jq -r '.result' <<<"$RESULT")" == "READY_FOR_REVIEW" ]] || { echo "Result is not READY_FOR_REVIEW"; exit 0; }
          [[ "$(jq -r '.human_action == null' <<<"$RESULT")" == "true" ]] || { echo "Result requests human action"; exit 0; }

          ACTUAL="$(curl --fail-with-body -sS "${AUTH[@]}" "${API}/pulls/${PR_NUMBER}/files?per_page=100" | jq -r '.[].filename' | sort)"
          EXPECTED="$(jq -r '.allowed_paths[]' <<<"$ENTRY" | sort)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "Changed paths do not exactly match fast-lane allowlist"; echo "Actual:"; echo "$ACTUAL"; echo "Expected:"; echo "$EXPECTED"; exit 0; }

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "task_id=$STATE_TASK" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "next_task_id=$(jq -r '.next_task_id // empty' <<<"$ENTRY")" >> "$GITHUB_OUTPUT"

      - name: Merge exact low-risk Relay PR
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          TASK_ID: ${{ steps.gate.outputs.task_id }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="$HEAD_SHA" \
            -f merge_method=squash \
            -f commit_title="[RELAY ${TASK_ID}] Fast-lane squash merge" \
            --jq '.merged' | grep -qx true

      - name: Advance preauthorized queue or return to Director
        if: steps.gate.outputs.eligible == 'true'
        env:
          TASK_ID: ${{ steps.gate.outputs.task_id }}
          NEXT_TASK_ID: ${{ steps.gate.outputs.next_task_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

          if [[ -n "$NEXT_TASK_ID" ]]; then
            NEXT="$(jq -c --arg id "$NEXT_TASK_ID" '.tasks[] | select(.task_id==$id)' .ai-ops/fastlane.json)"
            [[ -n "$NEXT" ]] || { echo "Configured next task missing: $NEXT_TASK_ID"; exit 1; }
            NEXT_REV="$(jq -r '.revision' <<<"$NEXT")"
            NEXT_PATH="$(jq -r '.task_path' <<<"$NEXT")"
            NEXT_RESULT="$(jq -r '.expected_result_path' <<<"$NEXT")"
            test -f "$NEXT_PATH"
            cp "$NEXT_PATH" .ai-ops/tasks/CURRENT_TASK.md
            jq \
              --arg last "$TASK_ID" \
              --arg id "$NEXT_TASK_ID" \
              --argjson rev "$NEXT_REV" \
              --arg path "$NEXT_PATH" \
              --arg result "$NEXT_RESULT" \
              '.status="READY_FOR_CLAUDE" | .last_accepted_task_id=$last | .current_task_id=$id | .current_task_revision=$rev | .current_task_path=$path | .expected_result_path=$result | .active_relay_pr=null | .approved_pr=null | .approved_head_sha=null | .pause_reason=null | .human_gate=null | .iterations_completed += 1' \
              .ai-ops/state.json > .ai-ops/state.json.tmp
            mv .ai-ops/state.json.tmp .ai-ops/state.json
          else
            jq \
              --arg last "$TASK_ID" \
              '.status="FASTLANE_AWAITING_DIRECTOR" | .last_accepted_task_id=$last | .active_relay_pr=null | .approved_pr=null | .approved_head_sha=null | .pause_reason=null | .human_gate=null | .iterations_completed += 1' \
              .ai-ops/state.json > .ai-ops/state.json.tmp
            mv .ai-ops/state.json.tmp .ai-ops/state.json
          fi

          git config user.name "relay-fastlane[bot]"
          git config user.email "relay-fastlane[bot]@users.noreply.github.com"
          git add .ai-ops/state.json .ai-ops/tasks/CURRENT_TASK.md
          if git diff --cached --quiet; then
            echo "No state transition to commit"
            exit 0
          fi
          git commit -m "relay: advance fast lane after ${TASK_ID}"
          git push origin HEAD:main
