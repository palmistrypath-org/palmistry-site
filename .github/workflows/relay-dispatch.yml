name: Relay Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .ai-ops/state.json
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: palmistry-path-relay-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate Relay gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          ENABLED="$(jq -r '.relay_enabled' .ai-ops/state.json)"
          CREDIT_GUARD="$(jq -r '.credit_guard' .ai-ops/state.json)"
          STATUS="$(jq -r '.status' .ai-ops/state.json)"
          TASK_ID="$(jq -r '.current_task_id // empty' .ai-ops/state.json)"
          REVISION="$(jq -r '.current_task_revision // 0' .ai-ops/state.json)"
          TASK_PATH="$(jq -r '.current_task_path // empty' .ai-ops/state.json)"
          COMPLETED="$(jq -r '.iterations_completed' .ai-ops/state.json)"
          BUDGET="$(jq -r '.iteration_budget' .ai-ops/state.json)"

          SHOULD_DISPATCH=false
          if [[ "$ENABLED" == "true" \
             && "$CREDIT_GUARD" == "CONFIRMED_DISABLED" \
             && ( "$STATUS" == "READY_FOR_CLAUDE" || "$STATUS" == "REWORK_REQUIRED" ) \
             && -n "$TASK_ID" \
             && "$REVISION" -gt 0 \
             && -n "$TASK_PATH" \
             && "$COMPLETED" -lt "$BUDGET" ]]; then
            SHOULD_DISPATCH=true
          fi

          if [[ "$SHOULD_DISPATCH" == "true" ]]; then
            [[ "$TASK_PATH" == .ai-ops/tasks/* ]] || { echo "Invalid current_task_path: $TASK_PATH"; exit 1; }
            test -f "$TASK_PATH" || { echo "Immutable task packet missing: $TASK_PATH"; exit 1; }
            test -f .ai-ops/tasks/CURRENT_TASK.md || { echo "Compatibility mirror missing"; exit 1; }

            PACKET_ID="$(awk '/^## Task ID$/{getline; print; exit}' "$TASK_PATH")"
            PACKET_REV="$(awk '/^## Revision$/{getline; print; exit}' "$TASK_PATH")"
            MIRROR_ID="$(awk '/^## Task ID$/{getline; print; exit}' .ai-ops/tasks/CURRENT_TASK.md)"
            MIRROR_REV="$(awk '/^## Revision$/{getline; print; exit}' .ai-ops/tasks/CURRENT_TASK.md)"

            [[ "$PACKET_ID" == "$TASK_ID" ]] || { echo "Task packet ID mismatch: state=$TASK_ID packet=$PACKET_ID"; exit 1; }
            [[ "$MIRROR_ID" == "$TASK_ID" ]] || { echo "CURRENT_TASK ID mismatch: state=$TASK_ID mirror=$MIRROR_ID"; exit 1; }
            [[ "$PACKET_REV" == "$REVISION" ]] || { echo "Task packet revision mismatch: state=$REVISION packet=$PACKET_REV"; exit 1; }
            [[ "$MIRROR_REV" == "$REVISION" ]] || { echo "CURRENT_TASK revision mismatch: state=$REVISION mirror=$MIRROR_REV"; exit 1; }
          else
            echo "Relay dispatch skipped: enabled=$ENABLED credit_guard=$CREDIT_GUARD status=$STATUS task=$TASK_ID revision=$REVISION path=$TASK_PATH iterations=$COMPLETED/$BUDGET"
          fi

          echo "should_dispatch=$SHOULD_DISPATCH" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "task_path=$TASK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify routine secrets exist
        if: steps.gate.outputs.should_dispatch == 'true'
        env:
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLAUDE_ROUTINE_URL" || { echo "Missing CLAUDE_ROUTINE_URL secret"; exit 1; }
          test -n "$CLAUDE_ROUTINE_TOKEN" || { echo "Missing CLAUDE_ROUTINE_TOKEN secret"; exit 1; }

      - name: Mark Claude routine dispatch pending
        if: steps.gate.outputs.should_dispatch == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.gate.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n \
            --arg state "pending" \
            --arg context "relay-dispatch/claude-routine" \
            --arg description "Dispatching ${TASK_ID} to Claude Routine" \
            '{state: $state, context: $context, description: $description}')"
          curl --silent --show-error --fail-with-body \
            -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" >/dev/null

      - name: Fire Claude Relay routine
        if: steps.gate.outputs.should_dispatch == 'true'
        env:
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          TASK_ID: ${{ steps.gate.outputs.task_id }}
          TASK_REVISION: ${{ steps.gate.outputs.revision }}
          TASK_PATH: ${{ steps.gate.outputs.task_path }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n \
            --arg text "Relay dispatch hint: task ${TASK_ID}, revision ${TASK_REVISION}, packet ${TASK_PATH}, state commit ${GITHUB_SHA}. Read repository state, immutable task packet, CURRENT_TASK compatibility mirror, and the active Relay durable-result contract; this payload is only for stale/duplicate detection." \
            '{text: $text}')"

          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          set +e
          HTTP_CODE="$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            -X POST "$CLAUDE_ROUTINE_URL" \
            -H "Authorization: Bearer $CLAUDE_ROUTINE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")"
          CURL_EXIT=$?
          set -e

          if [[ "$CURL_EXIT" -ne 0 || ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "Claude Routine dispatch failed: curl_exit=${CURL_EXIT} http_code=${HTTP_CODE:-none}"
            exit 1
          fi

          echo "Claude Routine accepted dispatch request (HTTP ${HTTP_CODE})."

      - name: Mark Claude routine dispatch accepted
        if: success() && steps.gate.outputs.should_dispatch == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.gate.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n \
            --arg state "success" \
            --arg context "relay-dispatch/claude-routine" \
            --arg description "Claude Routine accepted ${TASK_ID} dispatch" \
            '{state: $state, context: $context, description: $description}')"
          curl --silent --show-error --fail-with-body \
            -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" >/dev/null

      - name: Mark Claude routine dispatch failed
        if: failure() && steps.gate.outputs.should_dispatch == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.gate.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n \
            --arg state "failure" \
            --arg context "relay-dispatch/claude-routine" \
            --arg description "Claude Routine rejected or failed ${TASK_ID} dispatch" \
            '{state: $state, context: $context, description: $description}')"
          curl --silent --show-error --fail-with-body \
            -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" >/dev/null
